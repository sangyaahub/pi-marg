name: Feature request
description: Propose a focused PiMarg improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or job to be done
      description: Describe the user and the outcome they cannot achieve today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and how success can be observed.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime scope
      options:
        - Shared Pi + OMP behavior
        - Pi Agent only
        - Oh My Pi only
        - Documentation or demo only
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives and trade-offs
