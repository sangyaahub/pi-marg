name: npm-deploy-v2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: ./scripts/validate.sh
      - run: bun test tests
